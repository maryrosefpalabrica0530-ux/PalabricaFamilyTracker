<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mia | Family Money Planner</title><style>
:root{--blue:#1647dc;--navy:#15254c;--muted:#758097;--line:#e5eaf3;--bg:#f5f7fc;--orange:#ff8b47}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 17px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#edf1fc;color:var(--blue)}button.danger{background:#fff0ee;color:#b53131;padding:5px 9px}aside{position:fixed;inset:0 auto 0 0;width:240px;background:white;padding:34px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}.brand i{color:var(--orange);font-style:normal}small,.muted{color:var(--muted)}nav{margin-top:40px;display:grid;gap:8px}nav button{text-align:left;background:none;color:#64708c;padding:13px 15px;font-weight:550}nav button.active{background:#edf2ff;color:var(--blue)}.aside-note{margin-top:auto;background:#fff6dc;padding:18px;border-radius:15px;font-size:13px;line-height:1.6}main{margin-left:240px;padding:32px 45px;max-width:1550px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}h1{font-size:30px;margin:4px 0 8px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 20px}h3{margin:0 0 10px}p{line-height:1.6}header p{margin:0;color:var(--muted)}.tag{font-size:11px;letter-spacing:2px;font-weight:750;color:var(--blue)}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:24px;margin-bottom:20px}.hero{background:var(--blue);color:white;border:0;position:relative;overflow:hidden}.hero small{color:#cdd9ff}.hero strong{font-size:45px;display:block;margin:8px 0}.hero p{color:#d8e1ff;margin:0}.hero:after{content:'₱';position:absolute;right:40px;top:0;font-size:170px;color:#ffffff12;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.stat strong{display:block;font-size:26px;margin:9px 0}.stat{border-top:3px solid #dbe4ff}.stat:nth-child(2){border-top-color:#ffc789}.stat:nth-child(3){border-top-color:#7cd5be}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px}.sectionhead h2{margin:0}.sectionhead{margin-bottom:18px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}td,th{padding:13px 9px;border-bottom:1px solid var(--line)}.tablewrap{overflow-x:auto}.pill{background:#eef3ff;color:var(--blue);border-radius:20px;padding:5px 10px;font-size:12px;white-space:nowrap}.pill.warn{background:#fff0df;color:#a85812}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #dce2ed;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:14px 0}.progress{height:9px;background:#edf1fa;border-radius:10px;overflow:hidden;margin-top:13px}.progress span{height:100%;background:var(--blue);display:block}.goal{border:1px solid var(--line);border-radius:14px;padding:20px;margin:15px 0}.positive{color:#07866a}.negative{color:#c34141}label{display:block;font-size:13px;font-weight:650;margin:15px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d8dfec;border-radius:9px;color:var(--navy);background:white}input[type=checkbox]{width:auto}form .two{gap:15px}dialog{border:0;border-radius:20px;padding:28px;width:min(520px,94vw);box-shadow:0 25px 100px #15254c44}dialog::backdrop{background:#15254c66}form .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:25px}.notice{background:#fff6e5;border-radius:11px;padding:13px 16px;color:#82562a;font-size:13px;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tabs button{background:white;color:var(--navy);border:1px solid var(--line)}.toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:white;padding:13px 20px;border-radius:12px;z-index:10}.check label{padding:12px;background:#f6f8fd;border-radius:9px;display:flex;gap:12px}.foot{font-size:12px;color:var(--muted);margin-top:25px}@media(max-width:1050px){aside{width:195px}main{margin-left:195px;padding:25px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}@media(max-width:700px){aside{position:static;width:auto;padding:20px}nav{margin-top:18px;display:flex;overflow:auto}nav button{white-space:nowrap}.aside-note{display:none}main{margin:0;padding:20px}header{align-items:start;flex-direction:column}h1{font-size:26px}.hero strong{font-size:36px}.card{padding:19px}.grid{gap:0}}

@media(max-width:700px){body{font-size:14px}aside{padding:16px}.brand{font-size:24px}nav{gap:4px;padding-bottom:5px}nav button{padding:11px}main{padding:16px}header{gap:14px}header>button{width:100%}.hero strong{font-size:34px}.card{border-radius:14px}.sectionhead{flex-wrap:wrap}td,th{padding:11px 7px;min-width:75px}input,select,textarea{font-size:16px;min-height:44px}button{min-height:40px}.tablewrap{margin:0 -7px}.hero:after{right:10px}.toast{left:16px;right:16px;bottom:16px;text-align:center}}
</style><aside><div class="brand">mia<i>money.</i></div><small>FAMILY MONEY PLANNER</small><nav id="nav"></nav><div class="aside-note">☀ <b>Pangarap natin,<br>ipon natin.</b><br>Small steps. Shared goals.<br>One payday at a time.</div></aside><main><header><div><div class="tag">A LITTLE CLARITY, EVERY PAYDAY</div><h1 id="title"></h1><p id="subtitle"></p></div><button onclick="openForm('expense')">＋ Add expense</button></header><div id="app"></div><div class="foot">Saved on this browser only · Export a backup regularly · Amounts in Philippine pesos · No bank connection</div></main><dialog id="modal"></dialog><input type="file" id="import" accept="application/json" hidden><script>
const KEY='mia-money-v1',today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'}),uid=()=>crypto.randomUUID();
const initial=()=>({settings:{start:today(),end:'',opening:0,expected:14000,weekly:0},expenses:[],income:[],bills:[],goals:[],contributions:[],plans:[],checks:[]});let s;try{s=JSON.parse(localStorage.getItem(KEY))||initial()}catch{s=initial()}s.recurring=s.recurring||[];let page='Overview';const pages=['Overview','Payday plan','Bills calendar','Monthly fixed bills','Family expenses','Health fund','Savings goals','Creator budget','Weekly check-in','Settings & backup'];const icons=['◈','▣','▦','↻','↗','♡','◎','▷','✓','⚙'];const cats=['Food & groceries','Transport','Children & school','Household','Health','Creator','Personal','Other'];const money=n=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',maximumFractionDigits:2}).format(Number(n)||0);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sum=a=>a.reduce((n,x)=>n+Number(x.amount||0),0);const period=x=>x.date>=s.settings.start&&(!s.settings.end||x.date<=s.settings.end);const inCycle=a=>a.filter(period);const save=()=>{localStorage.setItem(KEY,JSON.stringify(s));render()};const notify=t=>{let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)};function calc(){let inc=sum(inCycle(s.income.filter(x=>x.status==='Received'))),spent=sum(inCycle(s.expenses)),saved=sum(inCycle(s.contributions)),cash=Number(s.settings.opening)+inc-spent-saved;let due=s.bills.filter(b=>!b.paid&&(!s.settings.end||b.due<=s.settings.end)),reserve=sum(due),pledged=sum(s.plans.filter(x=>x.type==='Savings'))-saved;return{inc,spent,saved,cash,reserve,available:cash-reserve-Math.max(0,pledged),due}}
function table(headers,rows){return rows.length?'<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<div class="empty">No entries yet. Start with your first record.</div>'}const delBtn=(type,id)=>`<button class="danger" aria-label="Delete record" onclick="remove('${type}','${id}')">×</button>`;function remove(type,id){if(type==='goals'&&s.contributions.some(x=>x.goal===id))return alert('Delete this goal’s contributions first to keep your cash balance accurate.');if(!confirm('Delete this record?'))return;if(type==='bills'){s.expenses=s.expenses.filter(x=>x.billId!==id)}if(type==='bills'){s.skipped=s.skipped||[];let b=s.bills.find(x=>x.id===id);if(b.recurringId)s.skipped.push(b.recurringId+':'+b.due.slice(0,7))}s[type]=s[type].filter(x=>x.id!==id);save()}
function stats(items){return '<div class="grid">'+items.map(([l,n,t])=>`<div class="card stat"><small>${l}</small><strong>${money(n)}</strong><small>${t}</small></div>`).join('')+'</div>'}function action(title,type,label='＋ Add'){return `<div class="sectionhead"><h2>${title}</h2><button class="secondary" onclick="openForm('${type}')">${label}</button></div>`}function expenses(a){return table(['Date','Item / category','Amount',''],a.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}<br><small>${esc(x.category)} · ${esc(x.person)}</small></td><td>${money(x.amount)}</td><td>${x.billId?'<small>Linked bill</small>':delBtn('expenses',x.id)}</td></tr>`))}function billTable(a){return table(['Due','Bill','Amount','Status',''],a.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(x=>`<tr><td>${esc(x.due)}${!x.paid&&x.due===today()?'<br><span class="pill warn">Due today</span>':''}</td><td>${esc(x.name)}${x.recurringId?'<br><small>Monthly · '+esc(x.payday||'Choose payday')+(x.variable?' · Estimate':'')+'</small>':''}</td><td>${money(x.amount)}${!x.paid?`<br><button class="secondary" style="padding:4px 8px;font-size:12px" onclick="adjustBill('${x.id}')">Edit amount</button>`:''}</td><td>${x.paid?'<span class="pill">Paid</span>':`<button class="secondary" onclick="payBill('${x.id}')">Mark paid</button>`}${!x.paid&&x.due<today()?'<br><small class="negative">Overdue</small>':''}</td><td>${delBtn('bills',x.id)}</td></tr>`))}
function linkLabels(){document.querySelectorAll('label').forEach((l,i)=>{let n=l.nextElementSibling;if(n&&['INPUT','SELECT','TEXTAREA'].includes(n.tagName)){if(!n.id)n.id='field-'+i;l.htmlFor=n.id}})}function render(){generateBills();document.querySelector('#nav').innerHTML=pages.map((p,i)=>`<button class="${p===page?'active':''}" onclick="page='${p}';render()">${icons[i]} &nbsp; ${p}</button>`).join('');document.querySelector('#title').textContent=page==='Overview'?'Your family, your next chapter.':page;const subs={'Overview':'Hi Mia. Let’s give every peso a purpose.','Payday plan':'Plan what this payday needs to cover.','Bills calendar':'Know what’s due before it becomes urgent.','Monthly fixed bills':'Set it once. See each monthly due date automatically.','Family expenses':'A small daily habit. A clearer family budget.','Health fund':'Keep health needs visible in your plan.','Savings goals':'Small amounts, steady progress.','Creator budget':'Track the money behind your creative work.','Weekly check-in':'15 minutes together, one clearer week.','Settings & backup':'Your dates, your starting point, your backup.'};document.querySelector('#subtitle').textContent=subs[page];const c=calc();let html='';const setup=!s.settings.end?'<div class="notice">Start here: set your payday dates and available opening money in <button class="secondary" onclick="page=\'Settings & backup\';render()">Settings</button>. No balances or old bills have been assumed.</div>':'';
if(page==='Overview'){html=setup+`<div class="card hero"><small>AVAILABLE UNTIL NEXT PAYDAY</small><strong>${money(c.available)}</strong><p>${esc(s.settings.start)} → ${esc(s.settings.end||'Set next payday')} · After unpaid bills and planned savings</p></div>`+stats([['Money on hand',c.cash,'Opening + received income − expenses − savings'],['Bills reserved',c.reserve,'Unpaid bills due before the cycle ends'],['Saved this cycle',c.saved,'Contributions actually set aside']])+`<div class="two"><div class="card">${action('Coming up','bill')}<p class="muted">Overdue + upcoming in the next 30 days · All months</p>${billTable(upcoming().slice(0,8))}<button class="secondary" style="margin-top:14px" onclick="page='Bills calendar';render()">View all bills</button></div><div class="card"><h2>Your spending mix</h2>${cats.map(cat=>{let a=sum(inCycle(s.expenses).filter(x=>x.category===cat));return a?`<div class="row"><span>${cat}</span><b>${money(a)}</b></div><div class="progress"><span style="width:${c.spent?a/c.spent*100:0}%"></span></div>`:''}).join('')||'<div class="empty">Your categories will appear as you log expenses.</div>'}</div></div><div class="card">${action('Recent expenses','expense')}${expenses(inCycle(s.expenses).slice(-6))}</div>`}
if(page==='Payday plan'){html=setup+stats([['Received income',c.inc,'Only received income counts'],['Planned spending',sum(s.plans.filter(x=>x.type==='Spending')),'Targets, separate from bill reserves'],['Available after commitments',c.available,'Not a bank account connection']])+`<div class="card">${action('Income this cycle','income')}${table(['Date','Source','Amount','Status',''],inCycle(s.income).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${delBtn('income',x.id)}</td></tr>`))}</div><div class="card">${action('Planned vs actual','plan')}${table(['Category / goal','Type','Planned','Actual','Remaining',''],s.plans.map(x=>{let actual=x.type==='Savings'?sum(inCycle(s.contributions).filter(v=>v.goal===x.category)):sum(inCycle(s.expenses).filter(v=>v.category===x.category));return `<tr><td>${esc(s.goals.find(g=>g.id===x.category)?.name||x.category)}</td><td>${x.type}</td><td>${money(x.amount)}</td><td>${money(actual)}</td><td class="${actual>x.amount?'negative':''}">${money(x.amount-actual)}</td><td>${delBtn('plans',x.id)}</td></tr>`}))}<p class="muted">Spending targets do not deduct cash twice. Bills and planned savings reserve money; actual expenses reduce cash. Plans apply to the selected cycle—clear or update them when starting a new cycle.</p></div>`}
if(page==='Bills calendar')html=`<div class="notice">Recurring bills generate automatically while you use the app. Marking paid creates one linked expense. Use Monthly fixed bills to set up rent, internet, utilities, and subscriptions.</div><div class="card">${action('All bills','bill')}${billTable(s.bills)}</div>`;
if(page==='Monthly fixed bills')html=recurringView();
if(page==='Family expenses')html=stats([['Spent this cycle',c.spent,'Includes paid bills'],['Family daily needs',sum(inCycle(s.expenses).filter(x=>['Food & groceries','Transport','Children & school','Household'].includes(x.category))),'Food, travel, school and home'],['Weekly target',s.settings.weekly,'Editable in Settings']])+`<div class="card">${action('Expense log','expense')}<label>Filter category</label><select onchange="document.querySelector('#filtered').innerHTML=expenses(inCycle(s.expenses).filter(x=>!this.value||x.category===this.value))"><option value="">All categories</option>${cats.map(x=>`<option>${x}</option>`).join('')}</select><div id="filtered">${expenses(inCycle(s.expenses))}</div></div>`;
if(page==='Health fund'){let hg=s.goals.filter(x=>x.kind==='Health');html=stats([['Health expenses',sum(inCycle(s.expenses).filter(x=>x.category==='Health')),'Actual expenses this cycle'],['Health savings balance',sum(s.contributions.filter(x=>hg.some(g=>g.id===x.goal)))+hg.reduce((n,g)=>n+Number(g.opening||0),0),'Contributions currently set aside'],['Health spending plan',sum(s.plans.filter(x=>x.category==='Health')),'Current cycle target']])+`<div class="two"><div class="card">${action('Health goals','goal')}${goals(hg)}</div><div class="card">${action('Medicine, checkups & tests','health')}${expenses(inCycle(s.expenses).filter(x=>x.category==='Health'))}<p class="muted">Use this to track costs and savings. Follow your clinician’s prescription for medicine timing.</p></div></div>`}
if(page==='Savings goals')html=`<div class="card">${action('What we’re saving for','goal')}${goals(s.goals)}</div><div class="card">${action('Savings contributions','contribution')}${table(['Date','Goal','Amount',''],s.contributions.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(s.goals.find(g=>g.id===x.goal)?.name||'Archived goal')}</td><td>${money(x.amount)}</td><td>${delBtn('contributions',x.id)}</td></tr>`))}<p class="muted">Contributions move money out of spendable cash. Starting saved amounts belong in goal settings and are excluded from opening spendable money.</p></div>`;
if(page==='Creator budget'){let received=sum(inCycle(s.income).filter(x=>x.creator&&x.status==='Received')),pending=sum(inCycle(s.income).filter(x=>x.creator&&x.status==='Pending')),cost=sum(inCycle(s.expenses).filter(x=>x.category==='Creator'));html=stats([['Received commissions',received,'Counts toward cash'],['Pending commissions',pending,'Not available to spend'],['Net creator income',received-cost,'Received less creator expenses']])+`<div class="tabs"><button onclick="openForm('creatorIncome')">＋ Commission / payout</button><button onclick="openForm('creatorExpense')">＋ Subscription / expense</button></div><div class="card"><h2>Creator income</h2>${table(['Date','Source','Amount','Status',''],s.income.filter(x=>x.creator&&period(x)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td>${x.status==='Pending'?`<button class="secondary" onclick="receive('${x.id}')">Mark received</button>`:'Received'}</td><td>${delBtn('income',x.id)}</td></tr>`))}</div><div class="card"><h2>Creator expenses</h2>${expenses(inCycle(s.expenses).filter(x=>x.category==='Creator'))}</div>`}
if(page==='Weekly check-in'){html=`<div class="two"><div class="card"><div class="tag">MIA + GERALD</div><h2>Magkakampi sa budget.</h2><p>Review the numbers, agree on the next step, and keep the conversation kind.</p><div class="check">${['Review expenses together','Check bills due next week','Confirm money available until payday','Agree on savings and personal allowances','Choose one improvement for next week'].map((x,i)=>`<label><input type="checkbox">${x}</label>`).join('')}</div><button style="margin-top:20px" onclick="openForm('check')">Save this week’s agreement</button></div><div class="card"><h2>Our agreements</h2>${s.checks.slice().reverse().map(x=>`<div class="goal"><small>${esc(x.date)}</small><p>${esc(x.note)}</p>${delBtn('checks',x.id)}</div>`).join('')||'<div class="empty">Your weekly notes will live here.</div>'}</div></div>`}
if(page==='Settings & backup'){html=`<div class="card"><h2>Your payday setup</h2><form id="settings"><div class="two"><div><label>Cycle starts</label><input name="start" type="date" value="${esc(s.settings.start)}" required></div><div><label>Cycle ends (day before next payday)</label><input name="end" type="date" value="${esc(s.settings.end)}" required></div></div><label>Opening spendable money at cycle start (₱)</label><input name="opening" type="number" min="0" step=".01" value="${s.settings.opening}" required><small>Exclude existing savings. Log only income received after this opening snapshot to avoid double counting.</small><label>Expected salary per payday (reference only)</label><input name="expected" type="number" min="0" step=".01" value="${s.settings.expected}"><label>Weekly family spending target</label><input name="weekly" type="number" min="0" step=".01" value="${s.settings.weekly}"><div class="actions"><button>Save setup</button></div></form></div><div class="card"><h2>Keep a copy of your records</h2><p>Records stay in this browser. Export a backup before clearing browser data or moving devices. Import replaces the current records.</p><div class="tabs"><button onclick="backup()">Export backup</button><button onclick="document.querySelector('#import').click()">Import backup</button></div></div>`}
document.querySelector('#app').innerHTML=html;linkLabels();document.querySelector('#settings')?.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.end<d.start)return alert('Cycle end must be on or after start.');s.settings={...d,opening:+d.opening,expected:+d.expected,weekly:+d.weekly};save();notify('Payday setup saved')})}
function goals(a){return a.map(g=>{let amount=Number(g.opening||0)+sum(s.contributions.filter(x=>x.goal===g.id));return `<div class="goal"><div class="row"><b>${esc(g.name)}</b>${delBtn('goals',g.id)}</div><small>${esc(g.kind)}${g.due?' · '+esc(g.due):''}</small><div class="row"><strong>${money(amount)}</strong><small>of ${money(g.target)}</small></div><div class="progress"><span style="width:${Math.min(100,g.target?amount/g.target*100:0)}%"></span></div><button class="secondary" style="margin-top:14px" onclick="openForm('contribution','${g.id}')">＋ Set aside money</button></div>`}).join('')||'<div class="empty">Create a health, emergency, or family savings goal.</div>'}
function field(label,name,type='text',value='',extra=''){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra} required>`}function select(label,name,options,value=''){return `<label>${label}</label><select name="${name}">${options.map(x=>{let v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`}).join('')}</select>`}
function openForm(type,goal=''){let content='',title='';if(['expense','health','creatorExpense'].includes(type)){title='Add expense';content=field('What did you spend on?','name')+field('Amount (₱)','amount','number','','min="0.01" step=".01"')+field('Date','date','date',today())+select('Category','category',cats,type==='health'?'Health':type==='creatorExpense'?'Creator':'Food & groceries')+select('Recorded for','person',['Mia','Gerald','Family'])}else if(['income','creatorIncome'].includes(type)){title='Add income';content=field('Source','name')+field('Amount (₱)','amount','number','','min="0.01" step=".01"')+field('Date received / expected','date','date',today())+select('Status','status',['Received','Pending'])+select('Creator income?','creator',[['no','No'],['yes','Yes']],type==='creatorIncome'?'yes':'no')}else if(type==='bill'){title='Add bill';content=field('Bill name','name')+field('Amount (₱)','amount','number','','min="0.01" step=".01"')+field('Due date','due','date',today())+select('Category','category',cats,'Household')}else if(type==='recurring'){title='Add monthly bill';content=field('Bill name (e.g. House rental)','name')+field('Monthly amount / estimate (₱)','amount','number','','min="0.01" step=".01"')+field('Due day each month (1–31)','day','number',5,'min="1" max="31" step="1"')+field('First month to track','start','month',today().slice(0,7))+'<label>Last month (optional, for installments)</label><input name="end" type="month">'+select('Budget from which payday?','payday',['15th payday','30th / month-end payday','Split across both paydays'])+select('Amount type','variable',[['no','Fixed (rent, internet)'],['yes','Estimate (electricity, water)']])+select('Category','category',cats,'Household')}else if(type==='goal'){title='Create a savings goal';content=field('Goal name','name')+select('Purpose','kind',['Emergency','Family','Health','Other'],page==='Health fund'?'Health':'Emergency')+field('Target amount (₱)','target','number','','min="0.01" step=".01"')+field('Already saved before this tracker (₱)','opening','number',0,'min="0" step=".01"')+'<label>Target date (optional)</label><input name="due" type="date">'}else if(type==='contribution'){if(!s.goals.length)return notify('Create a savings goal first');title='Set aside savings';content=select('Goal','goal',s.goals.map(x=>[x.id,x.name]),goal)+field('Amount (₱)','amount','number','','min="0.01" step=".01"')+field('Date','date','date',today())}else if(type==='plan'){title='Add payday target';content=select('Target type','type',['Spending','Savings'])+select('Category / savings goal','category',[...cats,...s.goals.map(g=>[g.id,g.name])])+field('Planned amount (₱)','amount','number','','min="0.01" step=".01"')}else{title='Weekly agreement';content=field('Check-in date','date','date',today())+'<label>Our next step</label><textarea name="note" rows="4" required placeholder="What will we do differently this week?"></textarea>'}let m=document.querySelector('#modal');m.innerHTML=`<form id="record"><h2>${title}</h2>${content}<div class="actions"><button type="button" class="secondary" onclick="document.querySelector('#modal').close()">Cancel</button><button>Save record</button></div></form>`;linkLabels();m.showModal();m.querySelector('form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=uid();for(let key of ['amount','target','opening'])if(key in x)x[key]=Number(x[key]);let collection={expense:'expenses',health:'expenses',creatorExpense:'expenses',income:'income',creatorIncome:'income',bill:'bills',goal:'goals',contribution:'contributions',plan:'plans',check:'checks',recurring:'recurring'}[type];if(collection==='income')x.creator=x.creator==='yes';if(type==='bill')x.paid=false;if(type==='recurring'){x.day=Number(x.day);x.variable=x.variable==='yes';x.active=true;if(x.end&&x.end<x.start)return alert('Last month must not precede first month.');}if(type==='plan'){let isGoal=s.goals.some(g=>g.id===x.category);if((x.type==='Savings')!==isGoal)return alert('Choose a savings goal for Savings, or an expense category for Spending.');if(s.plans.some(p=>p.type===x.type&&p.category===x.category))return alert('This category already has a target. Delete the old target first.')}s[collection].push(x);save();m.close();notify('Record saved')}}
function payBill(id){let b=s.bills.find(x=>x.id===id);if(b.paid)return;if(!confirm('Record this payment today? It will be added to expenses once.'))return;b.paid=true;s.expenses.push({id:uid(),billId:id,name:b.name,amount:b.amount,category:b.category,date:today(),person:'Family'});save()}function receive(id){let x=s.income.find(x=>x.id===id);x.status='Received';x.date=today();save()}function backup(){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mia-budget-'+today()+'.json';a.click();URL.revokeObjectURL(url)}document.querySelector('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.settings||!['expenses','income','bills','goals','contributions','plans','checks'].every(k=>Array.isArray(d[k])))throw Error();if(!confirm('Replace your current records with this backup?'))return;d.recurring=d.recurring||[];d.skipped=d.skipped||[];s=d;save();notify('Backup restored')}catch{alert('Could not import. Choose a valid Mia Money backup.')}e.target.value=''};

function addDays(day,n){let d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function upcoming(){return s.bills.filter(b=>!b.paid&&b.due<=addDays(today(),30)).sort((a,b)=>a.due.localeCompare(b.due))}
function generateBills(){let changed=false;const current=today().slice(0,7);let horizon=new Date(current+'-01T12:00:00');horizon.setMonth(horizon.getMonth()+2);const limit=horizon.toISOString().slice(0,7);s.skipped=s.skipped||[];for(let t of s.recurring.filter(t=>t.active)){let month=t.start;let guard=0;while(month<=limit&&(!t.end||month<=t.end)&&guard++<1200){let [year,m]=month.split('-').map(Number),last=new Date(year,m,0).getDate(),due=month+'-'+String(Math.min(t.day,last)).padStart(2,'0');let key=t.id+':'+month;if(!s.skipped.includes(key)&&!s.bills.some(b=>b.recurringId===t.id&&b.due.slice(0,7)===month)){s.bills.push({id:uid(),recurringId:t.id,name:t.name,amount:Number(t.amount),due,category:t.category,paid:false,payday:t.payday,variable:t.variable});changed=true}month=m===12?(year+1)+'-01':year+'-'+String(m+1).padStart(2,'0')}}if(changed)localStorage.setItem(KEY,JSON.stringify(s))}
function recurringView(){return `<div class="notice">Monthly bills appear automatically from your first tracking month through the next two months, including when you reopen the app. A due day of 31 becomes the last day in shorter months. No notification is sent while the app is closed.</div><div class="card">${action('Monthly fixed bills','recurring','＋ Monthly bill')}${table(['Bill','Monthly amount','Due day','Assigned payday','Repeat',''],s.recurring.map(t=>`<tr><td>${esc(t.name)}<br><small>${t.variable?'Estimated / variable':'Fixed amount'}</small></td><td>${money(t.amount)}</td><td>Day ${t.day}</td><td>${esc(t.payday)}</td><td>${t.start} → ${t.end||'Ongoing'}<br><span class="pill">${t.active?'Active':'Paused'}</span></td><td><button class="secondary" onclick="toggleRecurring('${t.id}')">${t.active?'Pause':'Resume'}</button></td></tr>`))}</div><div class="card"><h2>Suggested monthly categories</h2><div class="grid"><div><h3>Home essentials</h3><p>House rental · Internet plan · Electricity · Water</p></div><div><h3>Regular commitments</h3><p>Installments · School fees · Insurance, if applicable</p></div><div><h3>Creator subscriptions</h3><p>Editing apps · AI tools · Other monthly subscriptions</p></div></div><p class="muted">Payday assignment is a planning label. The dashboard reserves the full unpaid bill when it falls due in your cycle. Split bills need their full amount ready before the due date.</p></div>`}
function toggleRecurring(id){let t=s.recurring.find(t=>t.id===id);if(t.active){if(!confirm('Pause this bill? Future unpaid instances will be removed; past and paid records stay.'))return;t.active=false;s.bills=s.bills.filter(b=>b.recurringId!==id||b.paid||b.due<today())}else t.active=true;save()}
function adjustBill(id){let b=s.bills.find(b=>b.id===id);let raw=prompt('Actual amount for this due date (₱). Other months stay unchanged.',b.amount);if(raw===null)return;let amount=Number(raw);if(!Number.isFinite(amount)||amount<=0)return alert('Enter a valid positive amount.');b.amount=amount;b.variable=false;save()}

render();
</script></html>
